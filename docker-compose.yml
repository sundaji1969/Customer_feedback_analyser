# ReviewLens - Docker Compose
# Start everything:   docker compose up -d --build
# Dashboard:          http://localhost:${FRONTEND_PORT:-8502}
# API docs:           http://localhost:8000/docs
# Settings come from the .env file next to this file.

services:
  db:
    image: postgres:16-alpine
    container_name: reviewlens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: reviewlens-backend
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TAG_MODEL: ${TAG_MODEL:-}
      REPLY_MODEL: ${REPLY_MODEL:-}
      TAG_TEMPERATURE: ${TAG_TEMPERATURE:-0}
      REPLY_TEMPERATURE: ${REPLY_TEMPERATURE:-0.4}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-8}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      # Optional email alert for new HIGH-urgency reviews (off unless ALERT_EMAIL_TO and SMTP_HOST are set)
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      # Inside Docker the database host is the service name "db", not localhost
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: reviewlens-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8502}:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
