# Runs all tests on every push and pull request.
# They are offline (fake AI, SQLite, fake backend): no OpenAI key, no cost.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frontend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  docker:
    # Checks both images still build and the production compose file is valid.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.prod.yml config -q
        env:
          POSTGRES_PASSWORD: ci
          OPENAI_API_KEY: ci
          DASHBOARD_PASSWORD: ci
      - run: docker build -t reviewlens-backend ./backend
      - run: docker build -t reviewlens-frontend ./frontend
